[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meetinglens-docling-worker"
version = "0.2.0"
description = "Isolated, offline document parsing worker for MeetingLens"
requires-python = "==3.12.*"
dependencies = [
  "docling-slim[convert-core,feat-ocr-rapidocr-onnx,format-markdown,format-office,format-pdf,models-local]==2.117.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[project.scripts]
meetinglens-docling-worker = "meetinglens_docling_worker.worker:main"
meetinglens-docling-models = "meetinglens_docling_worker.models:main"

[dependency-groups]
dev = ["ruff==0.15.12"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
required-version = "==0.11.21"
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meetinglens_docling_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
