[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meetinglens-transcription-worker"
version = "0.1.0"
description = "Isolated, offline audio transcription worker for MeetingLens"
requires-python = "==3.12.*"
dependencies = [
  "av==16.0.1",
  "faster-whisper==1.2.1",
  "huggingface-hub==1.26.0",
  "pydantic==2.13.4",
]

[project.scripts]
meetinglens-transcription-worker = "meetinglens_transcription_worker.worker:main"
meetinglens-transcription-models = "meetinglens_transcription_worker.models:main"

[dependency-groups]
dev = ["ruff==0.15.12"]

[tool.uv]
required-version = "==0.11.21"
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meetinglens_transcription_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
