[[set]]
identifier = "meeting-data-commands"
description = "Allows the main MeetingLens UI to manage local meeting records."
permissions = [
  "allow-create-meeting",
  "allow-get-meeting",
  "allow-list-meetings",
  "allow-update-meeting",
  "allow-start-meeting",
  "allow-end-meeting",
  "allow-delete-meeting",
]

[[set]]
identifier = "sidecar-status-command"
description = "Allows the main MeetingLens UI to read the safe local Sidecar health status."
permissions = ["allow-check-sidecar-health"]

[[set]]
identifier = "document-management-commands"
description = "Allows the local main window to select, import, list, inspect, and delete meeting documents through the Rust trust boundary."
permissions = [
  "allow-select-and-import-documents",
  "allow-list-documents",
  "allow-get-document",
  "allow-request-delete-document",
  "allow-retry-delete-document",
  "allow-get-document-import-policy",
]

[[set]]
identifier = "secret-status-management"
description = "Allows the main MeetingLens UI to set, inspect status for, and delete an approved secret without reading it back."
permissions = [
  "allow-get-secret-status",
  "allow-set-secret",
  "allow-delete-secret",
]

[[set]]
identifier = "transcript-management-commands"
description = "Allows the local main window to import and manage transcript data through the Rust trust boundary."
permissions = [
  "allow-create-meeting-from-pasted-transcript",
  "allow-select-transcript-and-create-meeting",
  "allow-add-pasted-transcript-to-meeting",
  "allow-select-and-add-transcript-to-meeting",
  "allow-list-transcript-sources",
  "allow-get-transcript-source",
  "allow-list-transcript-segments",
  "allow-list-transcript-speaker-groups",
  "allow-rename-speaker-in-source",
  "allow-update-transcript-segment",
  "allow-delete-transcript-source",
  "allow-get-transcript-import-policy",
]
