[package]
name = "meetinglens"
version = "0.1.0"
description = "Privacy-first desktop meeting workspace"
authors = ["MeetingLens contributors"]
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meetinglens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", default-features = false }
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.9.0"
zip = { version = "=8.6.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
